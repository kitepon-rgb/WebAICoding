name: kitepon-blog

services:
  blog:
    build:
      context: .
    image: kitepon-blog:${KITEPON_BLOG_TAG:-local}
    container_name: kitepon-blog
    restart: unless-stopped
    ports:
      - "192.168.1.2:18851:8080"
    networks:
      edge:
        aliases:
          - kitepon-blog

networks:
  edge:
    external: true
    name: license-server_default
