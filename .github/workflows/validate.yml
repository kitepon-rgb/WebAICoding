name: Validate Hugo content

on:
  push:
    branches: [main]
    # dev.toの状態台帳だけのbot commitでは再ビルドしない。
    # articles/・同期/転載スクリプトの変更は検査対象に含める。
    paths-ignore:
      - 'books/**'
      - 'crossposted-devto.json'

permissions:
  contents: read

concurrency:
  group: content-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.164.0'
          extended: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install pipeline test dependencies
        run: npm ci
        working-directory: .github/scripts

      - name: Test content pipeline
        run: npm test
        working-directory: .github/scripts

      - name: Validate content
        run: node tools/validate-content.mjs

      - name: Check Zenn synchronization
        run: node tools/zenn-sync/sync.mjs --check

      - name: Build
        run: hugo --minify

      - name: Validate rendered articles
        run: node tools/validate-content.mjs --rendered
