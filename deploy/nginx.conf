pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  server_tokens off;
  sendfile on;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    # Hugo は baseURL=https://kitepon.dev/blog/ で生成する。Caddy は /blog を
    # 剥がさずそのまま渡すため、生成物を /blog 配下へ置いて path を一致させる。
    root /usr/share/nginx/html;
    index index.html;

    # container 単体の健全性確認用。Caddy を経由しないので /blog を付けない。
    location = /healthz {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    location /blog/ {
      try_files $uri $uri/ =404;
    }

    location = /blog {
      return 301 /blog/;
    }

    location ~* ^/blog/.*\.(?:css|png|jpe?g|webp|gif|svg|ico|woff2?|ttf|js)$ {
      expires 7d;
      add_header Cache-Control "public, max-age=604800, immutable";
      try_files $uri =404;
    }

    location / {
      return 404;
    }
  }
}
