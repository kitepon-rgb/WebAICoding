# 厳選アフィリエイト広告（記事ページ 右レール）。Amazonアソシエイト単独。手で1点ずつ選ぶ。
# AdSense等の自動配信は使わない＝外部JSゼロの静的バナー。
#
# 【フェーズ1（現在）】items: [] のまま ＝ partial が右レールに自作プロダクトを出す。
#   （フォールバック禁止の方針＝「準備中」は出さない。在庫が無いので出さないだけ）
# 【フェーズ2】ユーザーがAmazonアソシエイトに登録し、アソシエイトタグを渡したら、
#   下の雛形を参考に items を埋める＝右レールが厳選アフィリに切り替わる（コード変更不要）。
#
# 法令: 2023/10/1 景表法ステマ規制＋Amazon規約で「PR/広告」の明瞭な明示が必須。
#   → partial が全gearバナーに PR バッジを強制付与＋レール脚に disclosure と Amazon定型文を出す。
# 価格はバナーに焼かない（PA-API無しでのAmazon価格表示はOperating Agreement上不可）。
# 画像はメーカー公式product画像を static/ads/gear/ に置く（-v1 命名）。Amazon掲載画像のスクレイプはしない。
# 対象カテゴリ(enum): mini_pc / unified_mem / gpu_vram / ai_network / home_server
#   除外: 低価格普及品(BUFFALO/Corega) / 純ゲーミングGeForce訴求
meta:
  pr_badge: "PR"
  disclosure: "本欄はアフィリエイト広告を含みます。"
  amazon_statement: "当サイトは、Amazon.co.jpを宣伝しリンクすることによってサイトが紹介料を獲得できる手段を提供することを目的に設定されたアフィリエイトプログラムである、Amazonアソシエイト・プログラムの参加者です。"

# tag=kitepon-22 ＝本物のアソシエイトID（2026-06 登録・初期審査中）。url は Amazon 検索URL＋このタグ＝有効なアフィリリンク。
#   画像は当面 grok 生成の代表画像（スタイライズ）。より本物にするなら url を /dp/ASIN（特定商品）に・
#   画像をメーカー公式に差し替え（/ads/gear/ に -v2 命名でキャッシュ回避）。
items:
  - name: "高VRAM GPU"
    category: gpu_vram
    image: "/ads/gear/gpu-vram-v1.png"
    url: "https://www.amazon.co.jp/s?k=RTX+5090&tag=kitepon-22"
    blurb: "<b>VRAM多め</b>でローカルLLMを動かす"
    badge: "Amazon"
    program: amazon
    rel: "sponsored nofollow noopener"
    accent: 1
    enabled: true
    weight: 10

  - name: "AIミニPC / 自宅鯖"
    category: mini_pc
    image: "/ads/gear/mini-pc-v1.png"
    url: "https://www.amazon.co.jp/s?k=ミニPC+Ryzen+AI&tag=kitepon-22"
    blurb: "<b>省電力で常時稼働</b>。推論・ホームラボに"
    badge: "Amazon"
    program: amazon
    rel: "sponsored nofollow noopener"
    accent: 3
    enabled: true
    weight: 20
